<head>

<title>مهدیه و امیررضا</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#efe6d8;display:flex;align-items:center;justify-content:center}
.envelope-wrap{width:min(92vw,520px);height:min(82vh,420px);position:relative;perspective:1200px;cursor:pointer}
.envelope{position:absolute;inset:0;background:#ead9bd;border:1px solid #c5a878;box-shadow:0 15px 45px #0002;border-radius:8px;overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#d7c09d 50%,transparent 50.5%),linear-gradient(225deg,transparent 49.5%,#d7c09d 50%,transparent 50.5%);opacity:.75}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:#e2cba8;clip-path:polygon(0 0,100% 0,50% 78%);transform-origin:top;transition:transform 1s;z-index:4;border-bottom:1px solid #c5a878}
.seal{position:absolute;z-index:5;left:50%;top:49%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:#9a7740;color:white;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px #0003}
.hint{position:absolute;z-index:6;bottom:28px;left:0;right:0;text-align:center;color:#684f2d;font-size:16px}
.card{position:fixed;inset:0;background:#111e;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .8s;z-index:20}
.card img{max-width:96vw;max-height:94vh;width:auto;height:auto;object-fit:contain;box-shadow:0 15px 50px #0008;border-radius:4px}
.open .flap{transform:rotateX(180deg)}
.open .seal,.open .hint{opacity:0}
.open .card{opacity:1;pointer-events:auto}
.close{position:fixed;top:12px;right:14px;z-index:30;background:#fff;color:#654d2e;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;display:none}
.open .close{display:block}
</style>
</head>
